[project]
name = "shortbot"
version = "0.1.0"
description = "AI-assisted, short-only Binance USDⓈ-M futures toolkit (MCP tools + guardian)"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.27",         # exact version lives in uv.lock; upgrade deliberately (deploy/DEPLOY.md)
    "mcp>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "truststore>=0.10",     # use the OS trust store (TLS-intercepting proxies/AV on macOS)
    "websockets>=13",       # liquidation stream recorder
    "mplfinance>=0.12.10b0",
    "pandas>=2.2",
    "numpy>=2.0",           # imported directly (analogs, probability, backtest)
    "matplotlib>=3.8",      # imported directly (charts.py)
    "starlette>=1.0",       # web console (shortbot.web); already locked through mcp
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# exact versions in uv.lock: a ruff or mypy bump can bring new findings, so it moves deliberately (`uv lock -P ruff`)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16.10", "mypy>=2.4.0"]

[project.scripts]
shortbot = "shortbot.cli:main"
shortbot-mcp = "shortbot.mcp_server:main"
shortbot-guardian = "shortbot.guardian:main"
shortbot-admin = "shortbot.admin:main"        # human-only kill-switch controls (killswitch.py)
shortbot-web = "shortbot.web.server:main"     # the owner's browser console (docs/WEB.md)
shortbot-gateway = "shortbot.gateway_server:main"   # the sessions' order writes, behind SHORTBOT_GATEWAY (docs/GATEWAY.md)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortbot"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]   # laptop + EC2/Docker only

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------- lint (scripts/check lint; #43)
# https://docs.astral.sh/ruff/settings/. target-version comes from requires-python.
[tool.ruff]
line-length = 120   # the code's width (88, the default, is where isort would wrap imports; no E501 is selected)

[tool.ruff.lint]
# Listed, never the built-in default: ruff 0.16's is 416 rules (524 findings on 0f0f45d) and changes between releases.
select = [
    "F",        # pyflakes (replaces `uvx pyflakes`; honours the registration `# noqa: F401` in signals/__init__.py)
    "E9",       # syntax and IO errors
    "B",        # bugbear
    "PGH004",   # a noqa names its rule
    "RUF006",   # an asyncio task dropped before it finishes
    "DTZ",      # naive datetimes
    "T10",      # a debugger left in
    "G",        # logging calls format lazily
    "I",        # imports sorted (isort); `# noqa: I001` on a block's first line keeps an order that matters
    "UP",       # pyupgrade, for requires-python (datetime.UTC, collections.abc, builtin TimeoutError)
    "E4",       # imports: one per line, at the top (ruff exempts sys.path, os.environ and matplotlib.use between them)
    "E7",       # statements: one per line, no lambda assignment, no `l`/`O`/`I` names
    "RUF100",   # every noqa suppresses something (BLE001 below is external, so its reasons stay)
    "RUF007",   # successive pairs: itertools.pairwise, not zip(xs, xs[1:])
    "ASYNC",    # flake8-async: nothing blocks the event loop, no hand-rolled `timeout` parameter
    "PLE",      # pylint errors (raw zero-width and bidi characters: write them as \u escapes)
    "LOG",      # flake8-logging (.exception() only in an except block)
]
# B905, zip() without strict=: strict=True where the lengths match by construction and a mismatch is a bug (parallel
# lists, a gather's results, a row and its columns); strict=False where truncation is the point.
# `# noqa: BLE001 - <reason>` is the #37 lint's syntax (tests/test_error_lint.py: alert or re-raise), not ruff's
# BLE001 (re-raise or logging.exception): ruff calls 40 of those reasons unused, and RUF100 --fix would delete them.
external = ["BLE001"]

# ---------------------------------------------------------------- types (scripts/check types; #43)
# mypy, in three tiers. https://mypy.readthedocs.io/en/stable/config_file.html, .../existing_code.html
[tool.mypy]
files = ["src"]
python_version = "3.12"          # = requires-python
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]          # no py.typed and no stubs installed: their values are Any
module = ["ccxt", "ccxt.*", "feedparser", "mplfinance", "pandas"]
ignore_missing_imports = true

# Strict tier: the safety-critical modules, the order path among them. `strict` is global-only, so these are its
# flags (`mypy --help`, 2.4). Widen by adding a module here once it passes.
[[tool.mypy.overrides]]
module = [
    "shortbot.errors", "shortbot.commands", "shortbot.weight", "shortbot.symlock", "shortbot.exposure",
    "shortbot.steps", "shortbot.trading_orders", "shortbot.stale_guard", "shortbot.journal_writer",
    "shortbot.wal_holder", "shortbot.results", "shortbot.gateway_wire", "shortbot.gateway_server",
    "shortbot.gateway_client", "shortbot.gateway_health", "shortbot.gateway", "shortbot.intents", "shortbot.resolver",
    "shortbot.clientid", "shortbot.order_ids", "shortbot.stops", "shortbot.risk", "shortbot.risk_budget",
    "shortbot.killswitch", "shortbot.killswitch_ops", "shortbot.killswitch_rearm", "shortbot.entries_place",
    "shortbot.entries_amend", "shortbot.entries_cancel", "shortbot.entries_fills", "shortbot.entries_acts",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Every other module is the lenient tier (mypy's defaults), except this debt list: the modules with errors, 106 on
# 0f0f45d (724 errors), 90 after #83 (276; a mixin declares its host's attributes, as trading_orders.OrderFlow does),
# 29 after #85 (116).
# Remove a module once `mypy` passes without it; never add one.
[[tool.mypy.overrides]]
module = [
    "shortbot.backtest.cadence_study", "shortbot.backtest.card_tests", "shortbot.backtest.chain_study",
    "shortbot.backtest.features", "shortbot.backtest.funding_events", "shortbot.backtest.hedge",
    "shortbot.backtest.hedge_report", "shortbot.backtest.long_studies", "shortbot.backtest.replay_compare",
    "shortbot.backtest.replay_delays", "shortbot.backtest.replay_fetch", "shortbot.backtest.replay_study",
    "shortbot.backtest.replay_verify", "shortbot.backtest.report_v3", "shortbot.backtest.run",
    "shortbot.backtest.rungs", "shortbot.backtest.sim", "shortbot.backtest.strategies",
    "shortbot.backtest.strategies_flow", "shortbot.backtest.strategies_long2", "shortbot.backtest.strategies_more",
    "shortbot.backtest.strategies_v2", "shortbot.backtest.strategies_v3", "shortbot.backtest.strategies_v4",
    "shortbot.backtest.trail5m", "shortbot.backtest.trials_eff", "shortbot.backtest.trigger_rates",
    "shortbot.backtest.xs_factors", "shortbot.backtest.xs_features"
]
ignore_errors = true
