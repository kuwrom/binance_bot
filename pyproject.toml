[project]
name = "shortbot"
version = "0.1.0"
description = "AI-assisted, short-only Binance USDⓈ-M futures toolkit (MCP tools + guardian)"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.27",         # exact version lives in uv.lock; upgrade deliberately (deploy/DEPLOY.md)
    "mcp>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "truststore>=0.10",     # use the OS trust store (TLS-intercepting proxies/AV on macOS)
    "websockets>=13",       # liquidation stream recorder
    "mplfinance>=0.12.10b0",
    "pandas>=2.2",
    "numpy>=2.0",           # imported directly (analogs, probability, backtest)
    "matplotlib>=3.8",      # imported directly (charts.py)
    "starlette>=1.0",       # web console (shortbot.web); already locked through mcp
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# exact versions in uv.lock: a ruff or mypy bump can bring new findings, so it moves deliberately (`uv lock -P ruff`)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16.10", "mypy>=2.4.0"]

[project.scripts]
shortbot = "shortbot.cli:main"
shortbot-mcp = "shortbot.mcp_server:main"
shortbot-guardian = "shortbot.guardian:main"
shortbot-admin = "shortbot.admin:main"        # human-only kill-switch controls (killswitch.py)
shortbot-web = "shortbot.web.server:main"     # the owner's browser console (docs/WEB.md)
shortbot-gateway = "shortbot.gateway_server:main"   # the sessions' order writes, behind SHORTBOT_GATEWAY (docs/GATEWAY.md)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortbot"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]   # laptop + EC2/Docker only

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------- lint (scripts/check lint; #43)
# https://docs.astral.sh/ruff/settings/. target-version comes from requires-python.
[tool.ruff.lint]
# Listed, never the built-in default: ruff 0.16's is 416 rules (524 findings on 0f0f45d) and changes between releases.
select = [
    "F",        # pyflakes (replaces `uvx pyflakes`; honours the registration `# noqa: F401` in signals/__init__.py)
    "E9",       # syntax and IO errors
    "B",        # bugbear
    "PGH004",   # a noqa names its rule
    "RUF006",   # an asyncio task dropped before it finishes
    "DTZ",      # naive datetimes
    "T10",      # a debugger left in
    "G",        # logging calls format lazily
]
# zip() without strict= (69 sites): strict=True raises on a length mismatch, a behaviour change decided per site
ignore = ["B905"]
# `# noqa: BLE001 - <reason>` is the #37 lint's syntax (tests/test_error_lint.py: alert or re-raise), not ruff's
# BLE001 (re-raise or logging.exception): ruff calls 40 of those reasons unused, and RUF100 --fix would delete them.
external = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Known findings, kept on for every other file (cleanup commit after #36 step 2: noqa per line or a rename, then drop).
# B023: each closure is called in the loop iteration that defines it, so it sees the right value (18, checked by hand).
"src/shortbot/backtest/strategies.py" = ["B023"]
"src/shortbot/backtest/strategies_more.py" = ["B023"]
"src/shortbot/histdata.py" = ["B023"]
"src/shortbot/patterns.py" = ["B023"]
"tests/test_liq_stops.py" = ["B023"]
# B007: an unused loop variable (6): cosmetic
"src/shortbot/backtest/hedge_report.py" = ["B007"]
"src/shortbot/backtest/trigger_rates.py" = ["B007"]
"src/shortbot/cadence_shadow.py" = ["B007"]
"src/shortbot/lifecycle_report.py" = ["B007"]
"src/shortbot/signals/social.py" = ["B007"]
"tests/test_day_pnl.py" = ["B007"]

# ---------------------------------------------------------------- types (scripts/check types; #43)
# mypy, in three tiers. https://mypy.readthedocs.io/en/stable/config_file.html, .../existing_code.html
[tool.mypy]
files = ["src"]
python_version = "3.12"          # = requires-python
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]          # no py.typed and no stubs: their values are Any
module = ["ccxt", "ccxt.*", "feedparser", "mplfinance"]
ignore_missing_imports = true

# Strict tier: the safety-critical modules. `strict` is global-only, so these are its flags (`mypy --help`, 2.4).
# Widen by adding a module here once it passes (next: clientid, order_ids, stops, killswitch*, risk*, entries_*).
[[tool.mypy.overrides]]
module = [
    "shortbot.errors", "shortbot.commands", "shortbot.weight", "shortbot.symlock", "shortbot.exposure",
    "shortbot.steps", "shortbot.trading_orders", "shortbot.stale_guard", "shortbot.journal_writer",
    "shortbot.wal_holder", "shortbot.results", "shortbot.gateway_wire", "shortbot.gateway_server",
    "shortbot.gateway_client", "shortbot.gateway_health",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# Every other module is the lenient tier (mypy's defaults), except this debt list: the 106 modules with errors on
# 0f0f45d (724 errors; 400 are mixins reading their host's attributes: declare them as trading_orders.OrderFlow does).
# Remove a module once `mypy` passes without it; never add one.
[[tool.mypy.overrides]]
module = [
    "shortbot.app", "shortbot.audit", "shortbot.backtest.cadence_study", "shortbot.backtest.card_tests",
    "shortbot.backtest.chain_study", "shortbot.backtest.features", "shortbot.backtest.funding_events",
    "shortbot.backtest.hedge", "shortbot.backtest.hedge_report", "shortbot.backtest.long_studies",
    "shortbot.backtest.replay_compare", "shortbot.backtest.replay_delays", "shortbot.backtest.replay_fetch",
    "shortbot.backtest.replay_study", "shortbot.backtest.replay_verify", "shortbot.backtest.report_v3",
    "shortbot.backtest.run", "shortbot.backtest.rungs", "shortbot.backtest.sim", "shortbot.backtest.strategies",
    "shortbot.backtest.strategies_flow", "shortbot.backtest.strategies_long2", "shortbot.backtest.strategies_more",
    "shortbot.backtest.strategies_v2", "shortbot.backtest.strategies_v3", "shortbot.backtest.strategies_v4",
    "shortbot.backtest.trail5m", "shortbot.backtest.trials_eff", "shortbot.backtest.trigger_rates",
    "shortbot.backtest.xs_factors", "shortbot.backtest.xs_features", "shortbot.backup_rotate",
    "shortbot.cadence_shadow", "shortbot.charts", "shortbot.cli_cmds", "shortbot.cmd_kill", "shortbot.entries",
    "shortbot.entries_amend", "shortbot.entries_cancel", "shortbot.entries_place", "shortbot.entry_gates",
    "shortbot.entry_intents", "shortbot.exchange", "shortbot.fill_quality", "shortbot.fill_report",
    "shortbot.guardian", "shortbot.guardian_jobs", "shortbot.guardian_loop", "shortbot.guardian_margin",
    "shortbot.guardian_plan", "shortbot.guardian_positions", "shortbot.guardian_watch", "shortbot.histdaily",
    "shortbot.histdata", "shortbot.histdata_rest", "shortbot.histdata_vision", "shortbot.journal_research",
    "shortbot.killswitch", "shortbot.killswitch_ops", "shortbot.killswitch_rearm", "shortbot.ladder",
    "shortbot.lifecycle_data", "shortbot.lifecycle_report", "shortbot.lifecycle_study", "shortbot.margin",
    "shortbot.market.events", "shortbot.market.market_map", "shortbot.market.regime", "shortbot.mcp_server",
    "shortbot.mtf", "shortbot.mtf_live", "shortbot.news", "shortbot.notify", "shortbot.patterns_data",
    "shortbot.patterns_detect", "shortbot.positioning", "shortbot.probability.evaluate",
    "shortbot.probability.montecarlo", "shortbot.probe_stream", "shortbot.probe_trades", "shortbot.probes",
    "shortbot.procs", "shortbot.profile", "shortbot.read", "shortbot.reconcile", "shortbot.refresh",
    "shortbot.registry_forward", "shortbot.registry_seed", "shortbot.research", "shortbot.research_stats",
    "shortbot.risk_budget", "shortbot.scan_tiered", "shortbot.scanner", "shortbot.setup_ladder",
    "shortbot.setup_ladder_view", "shortbot.shadow_eval", "shortbot.signals.social", "shortbot.signals.tape",
    "shortbot.stops", "shortbot.stream_task", "shortbot.sweeps", "shortbot.targets_sync", "shortbot.trading_manage",
    "shortbot.trading_open", "shortbot.trial_register", "shortbot.warmup"
]
ignore_errors = true
