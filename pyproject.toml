[project]
name = "shortbot"
version = "0.1.0"
description = "AI-assisted, short-only Binance USDⓈ-M futures toolkit (MCP tools + guardian)"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.27",
    "mcp>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "truststore>=0.10",     # use the OS trust store (TLS-intercepting proxies/AV on macOS)
    "websockets>=13",       # liquidation stream recorder
    "mplfinance>=0.12.10b0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
shortbot = "shortbot.cli:main"
shortbot-mcp = "shortbot.mcp_server:main"
shortbot-guardian = "shortbot.guardian:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
